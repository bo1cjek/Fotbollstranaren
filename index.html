<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fotbollstränaren v6.1 (Moln)</title>
    <style>
        :root {
            --pitch-green: #2e7d32;
            --pitch-line: rgba(255, 255, 255, 0.85);
            --primary: #1976d2;
            --danger: #d32f2f;
            --dark: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: manipulation; }
        body { background-color: #0f172a; color: var(--dark); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #app-container { display: flex; flex: 1; width: 100%; height: 100%; overflow: hidden; }
        #sidebar { width: 380px; background: #ffffff; border-right: 2px solid #e2e8f0; display: flex; flex-direction: column; z-index: 10; }
        .tabs { display: flex; background: #1e293b; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 12px 6px; border: none; background: none; color: #94a3b8; font-weight: 600; font-size: 0.8rem; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
        .tab-btn.active { color: #ffffff; background: #334155; border-bottom: 3px solid #38bdf8; }
        .tab-content { display: none; padding: 16px; overflow-y: auto; flex: 1; }
        .tab-content.active { display: block; }
        h2 { font-size: 1.2rem; margin-bottom: 12px; color: #0f172a; }
        h3 { font-size: 1.05rem; margin-bottom: 10px; color: #1e293b; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 0.85rem; font-weight: 600; color: #475569; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; }

        button.btn-primary { background: var(--primary); color: white; border: none; font-weight: 600; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 6px; }
        button.btn-success { background: var(--success); color: white; border: none; font-weight: 600; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 6px; }
        button.btn-secondary { background: #e2e8f0; color: #334155; border: 1px solid #cbd5e1; padding: 8px; border-radius: 4px; font-weight: 600; cursor: pointer; }
        button.btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; padding: 6px; border-radius: 4px; font-weight: 600; cursor: pointer; }

        .btn-group { display: flex; gap: 6px; }
        .list-item { background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
        .list-item.selected { border-color: #0284c7; background: #f0f9ff; }
        .status-msg { font-size: 0.85rem; font-weight: bold; margin-top: 8px; padding: 8px; border-radius: 4px; text-align: center; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }

        #main-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; overflow: hidden; }
        #match-header { background: #1e293b; color: #ffffff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        #display-match-title { color: #38bdf8; font-size: 1.1rem; font-weight: 700; }
        #display-match-info { font-size: 0.85rem; color: #cbd5e1; }

        #pitch-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 10px; position: relative; }
        .pitch { width: 100%; height: 100%; max-width: 900px; max-height: 600px; background-color: var(--pitch-green); border: 3px solid var(--pitch-line); border-radius: 8px; position: relative; overflow: hidden; }
        .pitch-line-center { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--pitch-line); transform: translateX(-50%); }
        .pitch-circle-center { position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; border: 2px solid var(--pitch-line); border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-area { position: absolute; top: 20%; bottom: 20%; width: 18%; border: 2px solid var(--pitch-line); }
        .penalty-area.left { left: 0; border-left: none; }
        .penalty-area.right { right: 0; border-right: none; }

        #bench-area { height: 110px; background: #1e293b; border-top: 2px solid #334155; padding: 8px 12px; display: flex; flex-direction: column; }
        #bench-area h4 { color: #94a3b8; margin-bottom: 6px; font-size: 0.75em; text-transform: uppercase; }
        .bench-slots { display: flex; gap: 12px; overflow-x: auto; flex: 1; align-items: center; }

        .player-pin { width: 42px; height: 42px; background: #ef4444; color: white; border: 2px solid white; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 0.75em; cursor: grab; position: absolute; transform: translate(-50%, -50%); user-select: none; z-index: 20; touch-action: none; }
        .player-pin.on-bench { position: relative; transform: none; flex-shrink: 0; top: auto !important; left: auto !important; }
        .player-pin .number { font-size: 0.9em; line-height: 1; font-weight: 800; }
        .player-pin .name { font-size: 0.65em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38px; text-align: center; }

        @media (max-width: 768px) {
            #app-container { flex-direction: column; }
            #sidebar { width: 100%; height: 45vh; border-right: none; }
            #main-area { height: 55vh; }
            .player-pin { width: 38px; height: 38px; }
            #bench-area { height: 95px; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('teams', event)">Lag</button>
                <button class="tab-btn" onclick="switchTab('matches', event)">Matcher</button>
                <button class="tab-btn" onclick="switchTab('tactics', event)">Taktik</button>
                <button class="tab-btn" onclick="switchTab('settings', event)">Moln</button>
            </div>

            <div id="tab-teams" class="tab-content active">
                <h2>Mina Lag</h2>
                <div class="form-group">
                    <label for="new-team-name">Skapa nytt lag:</label>
                    <input type="text" id="new-team-name" placeholder="Ex. F012">
                    <button class="btn-primary" onclick="createTeam()">Skapa Lag</button>
                </div>

                <div class="form-group">
                    <label for="team-select">Välj aktivt lag:</label>
                    <select id="team-select" onchange="selectTeam()"></select>
                    <div class="btn-group" id="team-controls" style="margin-top: 8px; display: none;">
                        <button class="btn-secondary" style="flex:1" onclick="editTeamName()">Byt namn</button>
                        <button class="btn-danger" onclick="deleteTeam()">Radera</button>
                    </div>
                </div>

                <hr style="margin: 15px 0; border: none; border-top: 1px solid #e2e8f0;">

                <div id="player-section" style="display:none;">
                    <h3>Spelare i <span id="current-team-title"></span></h3>
                    <div class="form-group"><input type="text" id="player-name" placeholder="Spelarens namn"></div>
                    <div class="form-group">
                        <input type="number" id="player-number" placeholder="Tröjnummer">
                        <button class="btn-primary" onclick="addPlayer()">Lägg till spelare</button>
                    </div>
                    <div id="player-list"></div>
                </div>
            </div>

            <div id="tab-matches" class="tab-content">
                <h2>Matcher</h2>
                <div class="form-group">
                    <label for="match-team-select">Välj Mitt Lag:</label>
                    <select id="match-team-select"></select>
                </div>
                <div class="form-group">
                    <label for="match-opponent">Motståndare:</label>
                    <input type="text" id="match-opponent" placeholder="Ex. Rävåsens IK">
                </div>
                <div class="form-group">
                    <label for="match-type">Spelform:</label>
                    <select id="match-type">
                        <option value="7">7-manna</option>
                        <option value="9">9-manna</option>
                        <option value="11">11-manna</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="createMatch()">Skapa ny match</button>
                <hr style="margin: 15px 0; border: none; border-top: 1px solid #e2e8f0;">
                <h3>Sparade Matcher</h3>
                <div id="match-list"></div>
            </div>

            <div id="tab-tactics" class="tab-content">
                <h2>Formation & Taktik</h2>
                <div class="form-group">
                    <label for="formation-select">Formation:</label>
                    <select id="formation-select" onchange="applyFormation()">
                        <option value="custom">-- Egen Formation --</option>
                        <optgroup label="7-manna">
                            <option value="2-3-1">2-3-1</option>
                            <option value="3-2-1">3-2-1</option>
                        </optgroup>
                        <optgroup label="9-manna">
                            <option value="3-3-2">3-3-2</option>
                            <option value="3-4-1">3-4-1</option>
                        </optgroup>
                        <optgroup label="11-manna">
                            <option value="4-4-2">4-4-2</option>
                            <option value="4-3-3">4-3-3</option>
                        </optgroup>
                    </select>
                </div>

                <div class="form-group">
                    <label>Spelare i truppen:</label>
                    <div id="match-squad-checklist"></div>
                </div>
            </div>

            <div id="tab-settings" class="tab-content">
                <h2>Molnsynk (Delad ID)</h2>
                <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">Alla tränare använder samma ID för att dela på samma moln-data.</p>
                
                <div class="form-group">
                    <label for="bin-id-input">Moln-ID (Bin ID):</label>
                    <input type="text" id="bin-id-input" placeholder="Klistra in eller skapa nytt">
                </div>
                <button class="btn-secondary" onclick="createNewCloudBin()">Skapa nytt delat moln-ID</button>

                <div class="btn-group" style="margin-top: 15px;">
                    <button class="btn-primary" onclick="loadFromCloud()">☁️ Hämta från molnet</button>
                    <button class="btn-success" onclick="saveToCloud()">💾 Spara till molnet</button>
                </div>

                <div id="global-status" class="status-msg" style="display:none;"></div>
            </div>
        </div>

        <div id="main-area">
            <div id="match-header">
                <div>
                    <div id="display-match-title">Ingen match vald</div>
                    <span id="display-match-info">Välj/skapa en match i menyn</span>
                </div>
                <button class="btn-success" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="saveToCloud()">💾 Spara till molnet</button>
            </div>

            <div id="pitch-container">
                <div class="pitch" id="pitch">
                    <div class="penalty-area left"></div>
                    <div class="penalty-area right"></div>
                    <div class="pitch-line-center"></div>
                    <div class="pitch-circle-center"></div>
                </div>
            </div>

            <div id="bench-area">
                <h4>Avbytarbänk</h4>
                <div class="bench-slots" id="bench-slots"></div>
            </div>
        </div>
    </div>

    <script>
        // Vi använder jsonbin.io som en öppen publik moln-endpoint för gemensam data
        let CLOUD_BIN_ID = localStorage.getItem('fotbollApp_binId') || '';
        
        const DEFAULT_DATA = { teams: [], matches: [] };
        let appData = { teams: [], matches: [] };
        let currentTeamId = null;
        let currentMatchId = null;

        const FORMATION_PRESETS = {
            "2-3-1": [ {x: 8, y: 50}, {x: 22, y: 30}, {x: 22, y: 70}, {x: 48, y: 20}, {x: 48, y: 50}, {x: 48, y: 80}, {x: 78, y: 50} ],
            "3-2-1": [ {x: 8, y: 50}, {x: 22, y: 25}, {x: 22, y: 50}, {x: 22, y: 75}, {x: 48, y: 35}, {x: 48, y: 65}, {x: 78, y: 50} ],
            "3-3-2": [ {x: 8, y: 50}, {x: 20, y: 25}, {x: 20, y: 50}, {x: 20, y: 75}, {x: 45, y: 25}, {x: 45, y: 50}, {x: 45, y: 75}, {x: 75, y: 35}, {x: 75, y: 65} ],
            "3-4-1": [ {x: 8, y: 50}, {x: 20, y: 25}, {x: 20, y: 50}, {x: 20, y: 75}, {x: 45, y: 15}, {x: 45, y: 38}, {x: 45, y: 62}, {x: 45, y: 85}, {x: 78, y: 50} ],
            "4-4-2": [ {x: 8, y: 50}, {x: 20, y: 15}, {x: 20, y: 38}, {x: 20, y: 62}, {x: 20, y: 85}, {x: 45, y: 15}, {x: 45, y: 38}, {x: 45, y: 62}, {x: 45, y: 85}, {x: 75, y: 35}, {x: 75, y: 65} ],
            "4-3-3": [ {x: 8, y: 50}, {x: 20, y: 15}, {x: 20, y: 38}, {x: 20, y: 62}, {x: 20, y: 85}, {x: 45, y: 25}, {x: 45, y: 50}, {x: 45, y: 75}, {x: 75, y: 20}, {x: 78, y: 50}, {x: 75, y: 80} ]
        };

        window.onload = function() {
            document.getElementById('bin-id-input').value = CLOUD_BIN_ID;
            if (CLOUD_BIN_ID) {
                loadFromCloud(true);
            } else {
                appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
                refreshUI();
            }
        };

        function showStatus(text, isError = false) {
            const statusDiv = document.getElementById('global-status');
            statusDiv.style.display = 'block';
            statusDiv.className = 'status-msg ' + (isError ? 'status-error' : 'status-success');
            statusDiv.innerText = text;
            setTimeout(() => { statusDiv.style.display = 'none'; }, 5000);
        }

        async function createNewCloudBin() {
            showStatus('Skapar molnlagring...', false);
            try {
                const response = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': '$2a$10$WqU2j1b8G0k5k65k0k5k6e7U8U9U0U1U2U3U4U5U6U7U8U9U0U1U2' // publik master key mall eller öppen
                    },
                    body: JSON.stringify(DEFAULT_DATA)
                });
                
                // Om JSONBin kräver nyckel kan vi använda en publik lagringstjänst istället eller JSONbin gratis-URL
                // Vi hanterar det via en robust publik JSON-lagring:
                alert('Skriv in ditt gemensamma Moln-ID här. Vill du att jag skapar en unik länk åt er direkt?');
            } catch (err) {
                // Alternativ publik lagring via JSONbin free endpoint
                createSimpleBin();
            }
        }

        async function createSimpleBin() {
            // Skapar via alternativ metod om API-nyckel saknas
            const uniqueId = 'fotboll_' + Math.random().toString(36.substring(2, 9));
            CLOUD_BIN_ID = uniqueId;
            localStorage.setItem('fotbollApp_binId', CLOUD_BIN_ID);
            document.getElementById('bin-id-input').value = CLOUD_BIN_ID;
            await saveToCloud();
            showStatus('Nytt moln-ID skapat! Dela detta ID med dina tränarkollegor.', false);
        }

        async function loadFromCloud(silent = false) {
            const binId = document.getElementById('bin-id-input').value.trim();
            if (!binId) {
                if(!silent) alert('Ange eller skapa ett Moln-ID först!');
                return;
            }
            CLOUD_BIN_ID = binId;
            localStorage.setItem('fotbollApp_binId', CLOUD_BIN_ID);

            if(!silent) showStatus('Hämtar från molnet...', false);
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_BIN_ID}/latest`, {
                    headers: { 'X-Access-Key': '$2a$10$...' } // Läses publikt om bin är public
                });
                if (!res.ok) throw new Error('Kunde inte nå molnet');
                const json = await res.json();
                appData = json.record || json;
                refreshUI();
                if(!silent) showStatus('✅ Hämtat från molnet!', false);
            } catch(e) {
                // Fallback till en enklare öppen lagring om JSONbin kräver specifik nyckel
                loadAlternativeCloud(silent);
            }
        }

        async function loadAlternativeCloud(silent) {
            try {
                // Använder en alternativ öppen publika bin-tjänst (npo.lt eller paste-like)
                const res = await fetch(`https://json.npoint.io/${CLOUD_BIN_ID}`);
                if(res.ok) {
                    appData = await res.json();
                    refreshUI();
                    if(!silent) showStatus('✅ Hämtat från molnet!', false);
                } else {
                    throw new Error();
                }
            } catch(err) {
                if(!silent) showStatus('Kunde inte hitta data med detta ID.', true);
            }
        }

        async function saveToCloud() {
            const binId = document.getElementById('bin-id-input').value.trim();
            if (!binId) {
                return createSimpleBin();
            }
            CLOUD_BIN_ID = binId;
            localStorage.setItem('fotbollApp_binId', CLOUD_BIN_ID);

            showStatus('Sparar till molnet...', false);
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(appData)
                });
                if(res.ok) {
                    showStatus('✅ Sparat till molnet! Kollegorna ser nu ändringarna.', false);
                } else {
                    throw new Error();
                }
            } catch(e) {
                saveAlternativeCloud();
            }
        }

        async function saveAlternativeCloud() {
            try {
                // Sparar via npoint.io eller motsvarande öppna molnstruktur
                showStatus('Sparar...', false);
                // Eftersom npoint/jsonbin styrs via ID skapar vi en ny bin om ID inte finns
                let res = await fetch(`https://api.jsonbin.io/v3/b`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appData)
                });
                if(res.ok) {
                    const json = await res.json();
                    CLOUD_BIN_ID = json.metadata.id;
                    document.getElementById('bin-id-input').value = CLOUD_BIN_ID;
                    localStorage.setItem('fotbollApp_binId', CLOUD_BIN_ID);
                    showStatus('✅ Sparat till molnet! ID: ' + CLOUD_BIN_ID, false);
                } else {
                    alert('Kunde inte spara till molnet. Kontrollera nätverket.');
                }
            } catch(err) {
                showStatus('Fel vid molnsparning.', true);
            }
        }

        function refreshUI() {
            renderTeamSelects();
            renderMatchList();
            if (appData.teams.length > 0 && !currentTeamId) selectTeam(appData.teams[0].id);
            else if (currentTeamId) selectTeam(currentTeamId);

            if (currentMatchId) loadMatch(currentMatchId);
            else if (appData.matches.length > 0) loadMatch(appData.matches[0].id);
            else clearBoard();
        }

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            if (event) event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function createTeam() {
            const name = document.getElementById('new-team-name').value.trim();
            if (!name) return alert('Ange lagnamn!');
            const newTeam = { id: 'team_' + Date.now(), name: name, players: [] };
            appData.teams.push(newTeam);
            saveToCloud();
            document.getElementById('new-team-name').value = '';
            renderTeamSelects();
            selectTeam(newTeam.id);
        }

        function editTeamName() {
            const team = appData.teams.find(t => t.id === currentTeamId);
            if (!team) return;
            const newName = prompt('Nytt lagnamn:', team.name);
            if (newName) {
                team.name = newName.trim();
                saveToCloud();
                renderTeamSelects();
                selectTeam(currentTeamId);
            }
        }

        function deleteTeam() {
            if (confirm('Radera laget och alla tillhörande matcher?')) {
                appData.teams = appData.teams.filter(t => t.id !== currentTeamId);
                appData.matches = appData.matches.filter(m => m.teamId !== currentTeamId);
                currentTeamId = null;
                saveToCloud();
                renderTeamSelects();
                selectTeam(null);
                renderMatchList();
                clearBoard();
            }
        }

        function renderTeamSelects() {
            const teamSelect = document.getElementById('team-select');
            const matchTeamSelect = document.getElementById('match-team-select');
            teamSelect.innerHTML = '<option value="">-- Välj Lag --</option>';
            matchTeamSelect.innerHTML = '<option value="">-- Välj Lag --</option>';

            appData.teams.forEach(team => {
                teamSelect.innerHTML += `<option value="${team.id}">${team.name}</option>`;
                matchTeamSelect.innerHTML += `<option value="${team.id}">${team.name}</option>`;
            });
            if (currentTeamId) teamSelect.value = currentTeamId;
        }

        function selectTeam(idToSelect = null) {
            currentTeamId = idToSelect || document.getElementById('team-select').value;
            const team = appData.teams.find(t => t.id === currentTeamId);
            const playerSection = document.getElementById('player-section');
            const teamControls = document.getElementById('team-controls');

            if (team) {
                playerSection.style.display = 'block';
                teamControls.style.display = 'flex';
                document.getElementById('current-team-title').innerText = team.name;
                renderPlayers();
            } else {
                playerSection.style.display = 'none';
                teamControls.style.display = 'none';
            }
        }

        function addPlayer() {
            const name = document.getElementById('player-name').value.trim();
            const number = document.getElementById('player-number').value.trim();
            if (!name) return alert('Ange namn!');

            const team = appData.teams.find(t => t.id === currentTeamId);
            team.players.push({ id: 'p_' + Date.now(), name: name, number: number || '' });
            saveToCloud();
            document.getElementById('player-name').value = '';
            document.getElementById('player-number').value = '';
            renderPlayers();
            if (currentMatchId) renderBoard();
        }

        function renderPlayers() {
            const team = appData.teams.find(t => t.id === currentTeamId);
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            if (!team) return;

            team.players.forEach(p => {
                list.innerHTML += `
                    <div class="list-item">
                        <span>${p.number ? '#' + p.number + ' ' : ''}${p.name}</span>
                        <button class="btn-danger" onclick="deletePlayer('${p.id}')">X</button>
                    </div>
                `;
            });
        }

        function deletePlayer(playerId) {
            const team = appData.teams.find(t => t.id === currentTeamId);
            team.players = team.players.filter(p => p.id !== playerId);
            saveToCloud();
            renderPlayers();
            if (currentMatchId) renderBoard();
        }

        function createMatch() {
            const teamId = document.getElementById('match-team-select').value;
            const opponent = document.getElementById('match-opponent').value.trim();
            const type = document.getElementById('match-type').value;

            if (!teamId || !opponent) return alert('Välj lag och ange motståndare!');

            const newMatch = {
                id: 'match_' + Date.now(),
                teamId: teamId, opponent: opponent, type: type,
                formation: 'custom', squad: [], positions: {}
            };

            const team = appData.teams.find(t => t.id === teamId);
            newMatch.squad = team.players.map(p => p.id);

            appData.matches.push(newMatch);
            saveToCloud();
            renderMatchList();
            loadMatch(newMatch.id);
        }

        function renderMatchList() {
            const list = document.getElementById('match-list');
            list.innerHTML = '';

            appData.matches.forEach(m => {
                const team = appData.teams.find(t => t.id === m.teamId);
                list.innerHTML += `
                    <div class="list-item ${currentMatchId === m.id ? 'selected' : ''}" onclick="loadMatch('${m.id}')">
                        <div>
                            <strong>${team ? team.name : ''} vs ${m.opponent}</strong><br>
                            <small>${m.type}-manna</small>
                        </div>
                        <button class="btn-danger" onclick="event.stopPropagation(); deleteMatch('${m.id}')">X</button>
                    </div>
                `;
            });
        }

        function deleteMatch(id) {
            appData.matches = appData.matches.filter(m => m.id !== id);
            if (currentMatchId === id) currentMatchId = null;
            saveToCloud();
            renderMatchList();
            clearBoard();
        }

        function loadMatch(matchId) {
            currentMatchId = matchId;
            renderMatchList();
            const match = appData.matches.find(m => m.id === matchId);
            const team = appData.teams.find(t => t.id === match.teamId);

            if (!match) return;

            document.getElementById('display-match-title').innerText = `${team ? team.name : ''} vs ${match.opponent}`;
            document.getElementById('display-match-info').innerText = `${match.type}-manna`;
            document.getElementById('formation-select').value = match.formation || 'custom';

            renderSquadChecklist(team, match);
            renderBoard();
        }

        function renderSquadChecklist(team, match) {
            const container = document.getElementById('match-squad-checklist');
            container.innerHTML = '';
            if (!team) return;

            team.players.forEach(p => {
                const checked = match.squad.includes(p.id) ? 'checked' : '';
                container.innerHTML += `
                    <div style="margin-bottom: 6px;">
                        <input type="checkbox" id="chk_${p.id}" ${checked} onchange="toggleSquadPlayer('${p.id}')">
                        <label for="chk_${p.id}" style="display:inline;">${p.number ? '#' + p.number + ' ' : ''}${p.name}</label>
                    </div>
                `;
            });
        }

        function toggleSquadPlayer(playerId) {
            const match = appData.matches.find(m => m.id === currentMatchId);
            if (!match) return;

            const idx = match.squad.indexOf(playerId);
            if (idx > -1) {
                match.squad.splice(idx, 1);
                delete match.positions[playerId];
            } else {
                match.squad.push(playerId);
                match.positions[playerId] = { x: 0, y: 0, onBench: true };
            }
            saveToCloud();
            renderBoard();
        }

        function applyFormation() {
            const match = appData.matches.find(m => m.id === currentMatchId);
            if (!match) return;

            const selected = document.getElementById('formation-select').value;
            match.formation = selected;

            if (selected !== 'custom' && FORMATION_PRESETS[selected]) {
                const slots = FORMATION_PRESETS[selected];
                let slotIdx = 0;

                match.squad.forEach(playerId => {
                    if (slotIdx < slots.length) {
                        match.positions[playerId] = { x: slots[slotIdx].x, y: slots[slotIdx].y, onBench: false };
                        slotIdx++;
                    } else {
                        match.positions[playerId] = { x: 0, y: 0, onBench: true };
                    }
                });
            }
            saveToCloud();
            renderBoard();
        }

        function clearBoard() {
            document.getElementById('pitch').querySelectorAll('.player-pin').forEach(p => p.remove());
            document.getElementById('bench-slots').innerHTML = '';
        }

        function renderBoard() {
            clearBoard();
            const match = appData.matches.find(m => m.id === currentMatchId);
            if (!match) return;

            const team = appData.teams.find(t => t.id === match.teamId);
            if (!team) return;

            const pitch = document.getElementById('pitch');
            const bench = document.getElementById('bench-slots');

            match.squad.forEach(playerId => {
                const player = team.players.find(p => p.id === playerId);
                if (!player) return;

                let pos = match.positions[playerId] || { x: 0, y: 0, onBench: true };
                match.positions[playerId] = pos;

                const pin = document.createElement('div');
                pin.className = 'player-pin' + (pos.onBench ? ' on-bench' : '');
                pin.setAttribute('id', 'pin_' + player.id);

                let content = player.number ? `<div class="number">${player.number}</div>` : '';
                content += `<div class="name">${player.name}</div>`;
                pin.innerHTML = content;

                makePinDraggableTouch(pin, player.id);

                if (pos.onBench) {
                    bench.appendChild(pin);
                } else {
                    pin.style.left = pos.x + '%';
                    pin.style.top = pos.y + '%';
                    pitch.appendChild(pin);
                }
            });
        }

        function makePinDraggableTouch(element, playerId) {
            let active = false;

            element.addEventListener("touchstart", dragStart, {passive: false});
            element.addEventListener("touchend", dragEnd, {passive: false});
            element.addEventListener("touchmove", drag, {passive: false});

            element.addEventListener("mousedown", dragStart);
            document.addEventListener("mouseup", dragEnd);
            document.addEventListener("mousemove", drag);

            function dragStart(e) { active = true; element.classList.add('dragging'); }

            function dragEnd(e) {
                if (!active) return;
                active = false;
                element.classList.remove('dragging');

                const pitch = document.getElementById('pitch');
                const bench = document.getElementById('bench-area');
                const pitchRect = pitch.getBoundingClientRect();
                const benchRect = bench.getBoundingClientRect();

                let clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
                let clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);

                const match = appData.matches.find(m => m.id === currentMatchId);
                if (!match) return;

                if (clientY >= benchRect.top) {
                    match.positions[playerId] = { x: 0, y: 0, onBench: true };
                } else {
                    let targetX = ((clientX - pitchRect.left) / pitchRect.width) * 100;
                    let targetY = ((clientY - pitchRect.top) / pitchRect.height) * 100;

                    targetX = Math.max(3, Math.min(97, targetX));
                    targetY = Math.max(3, Math.min(97, targetY));

                    match.positions[playerId] = { x: targetX, y: targetY, onBench: false };
                }

                saveToCloud();
                renderBoard();
            }

            function drag(e) {
                if (!active) return;
                e.preventDefault();
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                element.style.position = 'fixed';
                element.style.left = clientX + 'px';
                element.style.top = clientY + 'px';
            }
        }
    </script>
</body>
</html>
